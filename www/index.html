<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مدير الراوتر</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 24px;
    max-width: 400px;
    width: 100%;
  }
  .icon {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    border-radius: 20px;
    color: #4ade80;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }
  .btn:active { background: #1d4ed8; }
  .info {
    margin-top: 20px;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    font-size: 12px;
    color: #64748b;
    text-align: right;
  }
  .info b { color: #94a3b8; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>مدير الراوتر</h1>
  <p>تطبيق Android لإدارة راوترات TP-Link</p>

  <div class="status">
    <span class="dot"></span>
    <span>Stage 1 — يعمل ✅</span>
  </div>

  <button class="btn" onclick="testNative()">اختبار Native</button>

  <div class="info">
    <b>Stage 1:</b> البنية تعمل<br>
    <b>التالي:</b> الاتصال بالراوتر
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>

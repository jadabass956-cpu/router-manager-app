<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>

    <linearGradient id="shieldGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>

    <radialGradient id="glowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>

    <filter id="shieldShadowSplash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="25"/>
      <feOffset dx="0" dy="15"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="checkGlowSplash" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="2732" height="2732" fill="url(#splashBg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#60A5FA" stroke-width="3" fill="none">
    <path d="M 0 200 L 2732 200 M 0 500 L 2732 500 M 0 800 L 2732 800
             M 0 1100 L 2732 1100 M 0 1400 L 2732 1400 M 0 1700 L 2732 1700
             M 0 2000 L 2732 2000 M 0 2300 L 2732 2300 M 0 2600 L 2732 2600"/>
    <path d="M 200 0 L 200 2732 M 500 0 L 500 2732 M 800 0 L 800 2732
             M 1100 0 L 1100 2732 M 1400 0 L 1400 2732 M 1700 0 L 1700 2732
             M 2000 0 L 2000 2732 M 2300 0 L 2300 2732 M 2600 0 L 2600 2732"/>
  </g>

  <!-- Glow behind shield -->
  <circle cx="1366" cy="1150" r="700" fill="url(#glowRadial)"/>

  <!-- ===== SHIELD ===== -->
  <g transform="translate(1366, 1050) scale(1.30)" filter="url(#shieldShadowSplash)">

    <!-- Shield -->
    <path d="M 0 -280
             C 0 -280, 220 -220, 280 -180
             L 280 -180
             C 280 100, 260 280, 0 480
             C -260 280, -280 100, -280 -180
             C -220 -220, 0 -280, 0 -280 Z"
          fill="url(#shieldGrad3)"
          stroke="#1E40AF"
          stroke-width="10"/>

    <!-- Signal waves -->
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M -130 -80 Q 0 -160 130 -80"/>
      <path d="M -95 -30 Q 0 -75 95 -30"/>
    </g>
    <circle cx="0" cy="20" r="16" fill="#FFFFFF"/>

    <!-- Router body -->
    <rect x="-160" y="70" width="320" height="115" rx="24" ry="24" fill="#FFFFFF"/>

    <!-- Antennas -->
    <g stroke="#FFFFFF" stroke-width="15" stroke-linecap="round">
      <line x1="-115" y1="70" x2="-130" y2="10"/>
      <line x1="115" y1="70" x2="130" y2="10"/>
    </g>

    <!-- LEDs -->
    <circle cx="-115" cy="127" r="11" fill="#10B981"/>
    <circle cx="-70" cy="127" r="11" fill="#10B981"/>
    <circle cx="-25" cy="127" r="11" fill="#F59E0B"/>
    <circle cx="20" cy="127" r="11" fill="#10B981"/>
    <circle cx="65" cy="127" r="11" fill="#10B981"/>
    <circle cx="110" cy="127" r="11" fill="#94A3B8"/>
  </g>

  <!-- Green check -->
  <g transform="translate(1560, 1280)" filter="url(#checkGlowSplash)">
    <circle cx="0" cy="0" r="110" fill="#10B981" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M -52 -5 L -15 32 L 55 -42"
          stroke="#FFFFFF"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- App name -->
  <text x="1366" y="1760"
        font-family="'Segoe UI','Roboto',sans-serif"
        font-size="150" font-weight="700"
        fill="#FFFFFF" text-anchor="middle"
        letter-spacing="2">
    TND Manager
  </text>

  <!-- Subtitle -->
  <text x="1366" y="1890"
        font-family="'Segoe UI','Roboto',sans-serif"
        font-size="55" font-weight="400"
        fill="#60A5FA" text-anchor="middle"
        letter-spacing="12">
    ROUTER MANAGER
  </text>

  <!-- Tagline -->
  <text x="1366" y="1990"
        font-family="'Segoe UI','Roboto',sans-serif"
        font-size="42" font-weight="300"
        fill="#93C5FD" text-anchor="middle"
        letter-spacing="1">
    🛡️ حماية شبكتك، خطوة بخطوة
  </text>

  <!-- Bottom accent line -->
  <rect x="1166" y="2075" width="400" height="8" rx="4" fill="#3B82F6"/>
</svg>


name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          VERSION="v1.0.${{ github.run_number }}"
          APK_NAME="router-manager-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          ls -lh artifacts/

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: router-manager-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload to catbox.moe (direct mirror)
        continue-on-error: true
        run: |
          set +e
          URL=$(curl -s --max-time 60 -F "reqtype=fileupload" -F "fileToUpload=@artifacts/${APK_NAME}" https://catbox.moe/user/api.php 2>&1 | tr -d '\n' | head -c 300)
          if [[ "$URL" =~ ^https:// ]]; then
            echo "CATBOX_URL=$URL" >> $GITHUB_ENV
            echo "catbox: $URL"
          else
            echo "catbox failed: $URL"
            echo "CATBOX_URL=(failed)" >> $GITHUB_ENV
          fi

      - name: Upload to 0x0.st (direct mirror)
        continue-on-error: true
        run: |
          set +e
          URL=$(curl -s --max-time 60 -F "file=@artifacts/${APK_NAME}" https://0x0.st 2>&1 | tr -d '\n' | head -c 300)
          if [[ "$URL" =~ ^https:// ]]; then
            echo "ZEROX_URL=$URL" >> $GITHUB_ENV
            echo "0x0.st: $URL"
          else
            echo "0x0.st failed: $URL"
            echo "ZEROX_URL=(failed)" >> $GITHUB_ENV
          fi

      - name: Build summary
        run: |
          {
            echo "## 📥 Router Manager ${VERSION}"
            echo ""
            echo "### 🟢 catbox.moe (مفضّل — مباشر)"
            echo "\`${CATBOX_URL}\`"
            echo ""
            echo "### 🟡 0x0.st (بديل)"
            echo "\`${ZEROX_URL}\`"
            echo ""
            echo "### 🔵 GitHub Releases"
            echo "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${APK_NAME}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Build ${{ env.VERSION }}
          body: |
            ## 📥 تنزيل مباشر (يعمل من سوريا):

            **🟢 catbox.moe:**
            ${{ env.CATBOX_URL }}

            **🟡 0x0.st:**
            ${{ env.ZEROX_URL }}

            **🔵 GitHub (قد يحتاج VPN):**
            https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.APK_NAME }}
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          VERSION="v1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/router-manager-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=router-manager-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: router-manager-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload to 0x0.st (mirror)
        id: mirror_0x0
        run: |
          URL=$(curl -s -F "file=@artifacts/${APK_NAME}" https://0x0.st || echo "FAILED")
          echo "url_0x0=$URL" >> $GITHUB_OUTPUT
          echo "0x0 URL: $URL"

      - name: Upload to file.io (mirror)
        id: mirror_fileio
        run: |
          URL=$(curl -s -F "file=@artifacts/${APK_NAME}" https://file.io || echo "FAILED")
          echo "url_fileio=$URL" >> $GITHUB_OUTPUT

      - name: Upload to transfer.sh (mirror)
        id: mirror_transfer
        run: |
          URL=$(curl -s --upload-file "artifacts/${APK_NAME}" "https://transfer.sh/${APK_NAME}" || echo "FAILED")
          echo "url_transfer=$URL" >> $GITHUB_OUTPUT

      - name: Summary with direct links
        run: |
          {
            echo "## 📥 روابط تنزيل مباشرة"
            echo ""
            echo "**الإصدار:** ${VERSION}"
            echo ""
            echo "### 🟢 0x0.st (مفضّل)"
            echo '${{ steps.mirror_0x0.outputs.url_0x0 }}'
            echo ""
            echo "### 🟡 transfer.sh"
            echo '${{ steps.mirror_transfer.outputs.url_transfer }}'
            echo ""
            echo "### 🔵 GitHub Releases"
            echo "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${APK_NAME}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Build ${{ env.VERSION }}
          body: |
            ## تنزيل مباشر (يعمل من سوريا):
            - **0x0.st:** ${{ steps.mirror_0x0.outputs.url_0x0 }}
            - **transfer.sh:** ${{ steps.mirror_transfer.outputs.url_transfer }}
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

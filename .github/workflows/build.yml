name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Install @capacitor/assets
        run: npm install --save-dev @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate cyber-security icons and splash
        run: |
          npx @capacitor/assets generate \
            --iconBackgroundColor '#0F172A' \
            --iconBackgroundColorDark '#0F172A' \
            --splashBackgroundColor '#0F172A' \
            --splashBackgroundColorDark '#0F172A'
          echo "=== Generated icons ==="
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ic_launcher*.png
          echo "=== Generated splash ==="
          ls -lh android/app/src/main/res/drawable-port-xxxhdpi/splash.png

      - name: Ensure app name is TND Manager
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">TND Manager</string>|' "$STRINGS"
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">TND Manager</string>|' "$STRINGS"
          fi
          echo "=== strings.xml ==="
          cat "$STRINGS"

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          VERSION="v1.0.${{ github.run_number }}"
          APK_NAME="router-manager-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          ls -lh artifacts/

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: router-manager-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload to temp.sh
        continue-on-error: true
        run: |
          set +e
          OUT=$(curl -s --max-time 120 --upload-file "artifacts/${APK_NAME}" "https://temp.sh/upload" 2>&1)
          URL=$(echo "$OUT" | grep -oE "https://[^ ]+" | head -1)
          if [ -n "$URL" ]; then
            echo "TEMPSH_URL=$URL" >> $GITHUB_ENV
            echo "temp.sh: $URL"
          else
            echo "temp.sh failed: $OUT"
            echo "TEMPSH_URL=(failed)" >> $GITHUB_ENV
          fi

      - name: Upload to tmpfiles.org
        continue-on-error: true
        run: |
          set +e
          RESP=$(curl -s --max-time 120 -F "file=@artifacts/${APK_NAME}" https://tmpfiles.org/api/v1/upload 2>&1)
          URL=$(echo "$RESP" | grep -oE '"url":"[^"]+"' | head -1 | sed 's/"url":"//;s/"//')
          if [ -n "$URL" ]; then
            DIRECT=$(echo "$URL" | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
            echo "TMPFILES_URL=$DIRECT" >> $GITHUB_ENV
            echo "tmpfiles: $DIRECT"
          else
            echo "tmpfiles failed: $RESP"
            echo "TMPFILES_URL=(failed)" >> $GITHUB_ENV
          fi

      - name: Upload to bashupload.com
        continue-on-error: true
        run: |
          set +e
          OUT=$(curl -s --max-time 120 --upload-file "artifacts/${APK_NAME}" "https://bashupload.com/${APK_NAME}" 2>&1)
          URL=$(echo "$OUT" | grep -oE "https://[^ ]+download[^ ]*" | head -1)
          if [ -n "$URL" ]; then
            echo "BASH_URL=$URL" >> $GITHUB_ENV
            echo "bashupload: $URL"
          else
            echo "bashupload failed: $OUT"
            echo "BASH_URL=(failed)" >> $GITHUB_ENV
          fi

      - name: Build summary
        run: |
          {
            echo "## 📥 Router Manager ${VERSION}"
            echo ""
            echo "### 🟢 temp.sh (مفضّل)"
            echo "\`${TEMPSH_URL}\`"
            echo ""
            echo "### 🟡 tmpfiles.org"
            echo "\`${TMPFILES_URL}\`"
            echo ""
            echo "### 🔵 bashupload.com"
            echo "\`${BASH_URL}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Build ${{ env.VERSION }}
          body: |
            ## 📥 روابط مباشرة (تعمل من سوريا):

            **🟢 temp.sh:**
            ${{ env.TEMPSH_URL }}

            **🟡 tmpfiles.org:**
            ${{ env.TMPFILES_URL }}

            **🔵 bashupload.com:**
            ${{ env.BASH_URL }}

            **GitHub (قد يحتاج VPN):**
            https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.APK_NAME }}
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
